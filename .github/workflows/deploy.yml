name: Déploiement odoc-landing (VPS)

# ─────────────────────────────────────────────────────────────────────────────
# Reconstruit l'image Docker "baked-in" odoc-landing (port 3000) sur le VPS et
# la relance. Résout le piège « mergé sur main mais pas en ligne » : à chaque
# push de code sur main, le site se déploie tout seul.
#
# ⚙️  À ACTIVER UNE SEULE FOIS — ajouter ces 4 secrets dans GitHub :
#     Repo → Settings → Secrets and variables → Actions → New repository secret
#       VPS_HOST      = 151.80.144.236
#       VPS_USER      = root
#       VPS_SSH_KEY   = (la clé privée SSH qui a accès au VPS — celle du PC Windows)
#       VPS_REPO_DIR  = chemin du repo odoc-landing sur le VPS (ex: /home/claude-agent/odoc-site-blog)
#
#   Ensuite : push sur main = déploiement auto. Ou manuel : onglet "Actions" →
#   "Déploiement odoc-landing (VPS)" → "Run workflow" (ou `gh workflow run deploy.yml`).
#
# ⚠️  Ne touche JAMAIS le conteneur du SaaS (odoc-frontend, port 3001).
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'refonte/**'
      - '.github/**'
  workflow_dispatch: {}
  # ── Rebuild QUOTIDIEN : indispensable, pas un confort ────────────────────────
  # Le blog est PRÉ-RENDU au build (`prerender-blog.ts` → dist/blog/<slug>/index.html)
  # et le sitemap est GÉNÉRÉ au build (`generate-sitemap.ts`). Or l'agent blog publie
  # 3 articles/jour DIRECTEMENT EN BASE, sans jamais toucher au repo → aucun push,
  # donc aucun rebuild, donc les nouveaux articles n'existent ni en HTML pré-rendu
  # ni dans le sitemap.
  #
  # Constaté le 31/07/2026 : dernier build le 10/07 → 84 articles publiés mais
  # seulement 37 pré-rendus et 37 dans le sitemap. Les 47 autres étaient servis
  # comme une coquille SPA de 5,9 ko portant le titre générique du site (au lieu
  # de 30 ko avec les vraies balises title/description/og) et restaient absents du
  # sitemap, donc indécouvrables. Un mois de production de contenu invisible.
  #
  # 17:00 UTC = après le dernier créneau de publication du jour (06/11/16 UTC),
  # donc les 3 articles quotidiens sont ramassés dans le même build.
  schedule:
    - cron: '0 17 * * *'

concurrency:
  group: deploy-odoc-landing
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild & relance odoc-landing sur le VPS
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: "15m"
          script: |
            set -e
            cd "${{ secrets.VPS_REPO_DIR }}"
            echo "→ git pull"
            git pull origin main
            echo "→ docker build odoc-landing"
            docker build -t odoc-landing .
            echo "→ restart conteneur"
            docker stop odoc-landing 2>/dev/null || true
            docker rm odoc-landing 2>/dev/null || true
            docker run -d --name odoc-landing --network coolify -p 3000:80 --restart unless-stopped odoc-landing
            sleep 3
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000 || echo "000")
            echo "→ HTTP local: $code"
            test "$code" = "200"
