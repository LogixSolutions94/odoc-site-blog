server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # ── Headers de sécurité (audit 2026-06-16) ──────────────────────────────
    # ⚠️ HÉRITAGE nginx : un bloc (location, if) qui déclare le moindre `add_header`
    # perd TOUS ceux du niveau server. Les blocs /blog et www ci-dessous n'en déclarent
    # donc aucun : ils héritent de ceux-ci, y compris sur leurs 301 / 404 / 410.
    # HSTS : 1 an, sous-domaines compris, preload-ready.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Anti-clickjacking : impossible d'embarquer le site dans une iframe externe.
    add_header X-Frame-Options "DENY" always;
    # Anti MIME-sniffing.
    add_header X-Content-Type-Options "nosniff" always;
    # Pas de leak d'URL complète vers les domaines externes.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Bloque l'accès aux APIs sensibles depuis le site (caméra, micro, géoloc…).
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    # CSP : self + Umami (analytics) + Supabase (API REST/EF) + Fontshare (typo).
    # ⚠️ Si on ajoute une dépendance externe (CDN), il faudra l'ajouter ici.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://analytics.odocpilot.com; style-src 'self' 'unsafe-inline' https://api.fontshare.com https://cdn.fontshare.com; font-src 'self' https://cdn.fontshare.com data:; img-src 'self' data: https:; connect-src 'self' https://api.odocpilot.com https://analytics.odocpilot.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ── Hôte canonique ───────────────────────────────────────────────────────
    # Traefik envoie odocpilot.com ET www.odocpilot.com à ce conteneur : sans cette
    # règle, www répond 200 et Google indexe un doublon du site entier.
    # (`return` seul dans un `if` de niveau server : usage sûr de `if`.)
    if ($host = "www.odocpilot.com") {
        return 301 https://odocpilot.com$request_uri;
    }

    # ── Pages d'erreur ───────────────────────────────────────────────────────
    # 404 et 410 ont pour corps la SPA (index.html) mais GARDENT leur statut (pas de
    # « = » dans error_page) : les robots lisent l'erreur, les humains voient la page.
    error_page 404 410 /index.html;

    # Bloque l'accès aux source maps et fichiers sensibles (défense en profondeur).
    # Vite ne génère pas de .map en build prod par défaut, mais on bloque au cas où.
    location ~* \.(map|env|sql|lock|lockb|ts|tsx)$ {
        deny all;
        return 404;
    }
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Assets statiques : cache 1 an
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|avif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-déclarer les headers sécurité dans ce location (sinon écrasés par add_header local).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ── Blog ─────────────────────────────────────────────────────────────────
    # Une seule URL pour la liste : /blog/ → /blog.
    location = /blog/ {
        return 301 https://odocpilot.com/blog;
    }

    # /blog/<slug>, dans cet ordre :
    #   1. article retiré → 301 vers sa cible, ou 410. Table $blog_retired générée
    #      depuis seo/blog-redirects.json (conf.d/00-blog-redirects.conf) ;
    #   2. article prérendu → dist/blog/<slug>/index.html (200) ;
    #   3. sinon → 404. Plus de repli SPA sous /blog/ : un article inconnu ou dépublié
    #      n'est plus une « soft 404 » servie en 200.
    location /blog/ {
        # Slash final → même URL sans slash (une seule forme par article).
        rewrite ^(/blog/.+)/$ https://odocpilot.com$1 permanent;
        if ($blog_retired = "410") {
            return 410;
        }
        if ($blog_retired) {
            return 301 https://odocpilot.com$blog_retired$is_args$args;
        }
        try_files $uri/index.html =404;
    }

    # Pages prérendues (dist/<route>/index.html), servies SANS redirection 301 :
    # le canonical pointe vers l'URL sans slash, elle doit résoudre directement.
    # ⚠️ PAS de `$uri/` ici : un dossier prérendu capterait sa route et renverrait
    # 403/404 au lieu de retomber sur le shell SPA. Hors /blog/, repli SPA inchangé.
    location / {
        try_files $uri $uri/index.html /index.html;
    }
}
