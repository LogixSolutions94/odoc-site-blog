server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Assets statiques : cache 1 an
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|avif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Articles pré-rendus : servir /blog/<slug>/index.html SANS redirection 301
    # (le canonical pointe vers l'URL sans slash → elle doit résoudre directement)
    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }
}
