server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Assets statiques : cache 1 an
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|avif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Articles pré-rendus : servir /blog/<slug>/index.html SANS redirection 301
    # (le canonical pointe vers l'URL sans slash → elle doit résoudre directement)
    # ⚠️ PAS de `$uri/` ici : le prérendu crée le dossier /blog/ (via /blog/<slug>/),
    # donc `$uri/` capterait /blog (et autres routes SPA dont le dossier existe) et
    # renverrait 403/404 au lieu de retomber sur le shell SPA. On retombe sur /index.html.
    location / {
        try_files $uri $uri/index.html /index.html;
    }
}
