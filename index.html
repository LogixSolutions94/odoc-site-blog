    <meta property="og:title" content="Facture électronique obligatoire : soyez en règle | OdocPilot" />
    <meta property="og:description" content="Créez vos factures au format légal (Factur-X), recevez et rangez celles de vos fournisseurs, et sachez ce qui change pour vous en 2026 et 2027. Gratuit pour commencer." />

    <!-- Thème (synchrone, avant React) pour éviter le flash, défaut CLAIR.
         Script externe et non inline : la CSP (nginx.conf) n'autorise que script-src 'self',
         un script inline y est bloqué et le thème n'était jamais appliqué avant React. -->
    <script src="/theme-init.js"></script>

    <!-- Police : Switzer (Fontshare, autorisée par la CSP de nginx.conf). display=swap. -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
    <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700,800,401&display=swap" rel="stylesheet">

    <!-- Schema.org JSON-LD: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "OdocPilot",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "OdocPilot aide les auto-entrepreneurs, TPE et PME à passer à la facture électronique : factures au format Factur-X (EN 16931), lecture automatique des factures reçues, recherche de documents, relances des impayés et export comptable FEC. Données hébergées en France.",
      "url": "https://odocpilot.com",
      "offers": [
        {"@type": "Offer", "name": "Conformité", "price": "0", "priceCurrency": "EUR"},
        {"@type": "Offer", "name": "Essentiel", "price": "29.00", "priceCurrency": "EUR"},
        {"@type": "Offer", "name": "Pro", "price": "49.00", "priceCurrency": "EUR"},
        {"@type": "Offer", "name": "Équipe", "price": "89.00", "priceCurrency": "EUR"},
        {"@type": "Offer", "name": "Manager", "price": "149.00", "priceCurrency": "EUR"}
      ]
    }
    </script>

    <!-- Schema.org JSON-LD: Organization
         TODO sameAs : une fois les profils créés, ré-ajouter après "address" (avec une virgule) :
         "sameAs": [ "https://www.linkedin.com/company/odocpilot", "https://x.com/odocpilot" ]
         Retirés pour l'instant car les profils n'existent pas (liens 404 = signal négatif). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "OdocPilot",
      "url": "https://odocpilot.com",
      "logo": {
        "@type": "ImageObject",
        "url": "https://odocpilot.com/logo.svg",
        "width": 512,
        "height": 512
      },
      "description": "OdocPilot, logiciel français de facture électronique pour les auto-entrepreneurs, TPE et PME : factures au format légal, factures reçues lues automatiquement, relances et export comptable.",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "contact@odocpilot.com",
        "contactType": "customer support",
        "availableLanguage": "French"
      },
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "FR"
      }
    }
    </script>

    <!-- Schema.org JSON-LD: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "OdocPilot",
      "url": "https://odocpilot.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://odocpilot.com/blog?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Mesure d'audience (Umami) chargée par src/lib/analytics.ts : HTTPS uniquement + après consentement (RGPD). -->
  </body>
</html>
