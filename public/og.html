<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<!-- Source de public/og-image.png (1200 × 630). Régénérer : capture de cette page à 1200 × 630. -->
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@500,700,800&display=swap">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  .og {
    width: 100vw; height: 100vh; position: relative;
    background: #FFFFFF; color: #0F2229;
    font-family: 'Switzer', 'Helvetica Neue', Arial, sans-serif;
    padding: 56px 80px; display: flex; flex-direction: column; justify-content: center;
  }
  .desk { position: absolute; inset: 0 0 0 auto; width: 30%; background: #F1F4F2; border-left: 1px solid #E3E8E5; display: flex; align-items: center; justify-content: center; }
  .desk svg { width: 230px; height: 230px; }
  .brand { position: absolute; top: 52px; left: 80px; display: flex; align-items: center; gap: 14px; }
  .brand svg { width: 46px; height: 46px; }
  .brand .name { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; }
  .brand sup { font-size: 13px; font-weight: 700; margin-left: 2px; }
  .eyebrow { position: relative; font-size: 22px; font-weight: 500; color: #4A5A5F; margin-top: 40px; }
  h1 { position: relative; font-size: 74px; line-height: 1; font-weight: 800; letter-spacing: -0.042em; margin-top: 22px; }
  .mk { background: linear-gradient(transparent 58%, rgba(255,159,67,.72) 58%, rgba(255,159,67,.72) 94%, transparent 94%); padding: 0 2px; }
  .sub { position: relative; margin-top: 28px; font-size: 26px; font-weight: 500; color: #4A5A5F; max-width: 700px; line-height: 1.4; }
  .foot { position: absolute; bottom: 44px; left: 80px; font-size: 22px; font-weight: 700; color: #0F2229; }
</style>
</head>
<body>
  <div class="og">
    <div class="desk"><svg viewBox="-1 -1 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g stroke="#0F2229" stroke-width="1">
          <ellipse cx="20" cy="20" rx="18" ry="8"/>
          <ellipse cx="20" cy="20" rx="8" ry="18" transform="rotate(45 20 20)"/>
          <ellipse cx="20" cy="20" rx="8" ry="18" transform="rotate(-45 20 20)"/>
          <circle cx="20" cy="20" r="18"/>
        </g>
        <g fill="#0F2229"><circle cx="20" cy="2" r="2.5"/><circle cx="38" cy="20" r="2.5"/><circle cx="20" cy="38" r="2.5"/><circle cx="2" cy="20" r="2.5"/></g>
      </svg></div>
    <div class="brand">
      <svg viewBox="-1 -1 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g stroke="#0F2229" stroke-width="1.5">
          <ellipse cx="20" cy="20" rx="18" ry="8"/>
          <ellipse cx="20" cy="20" rx="8" ry="18" transform="rotate(45 20 20)"/>
          <ellipse cx="20" cy="20" rx="8" ry="18" transform="rotate(-45 20 20)"/>
          <circle cx="20" cy="20" r="18"/>
        </g>
        <g fill="#0F2229"><circle cx="20" cy="2" r="2.5"/><circle cx="38" cy="20" r="2.5"/><circle cx="20" cy="38" r="2.5"/><circle cx="2" cy="20" r="2.5"/></g>
      </svg>
      <div class="name">OdocPilot<sup>®</sup></div>
    </div>
    <div class="eyebrow">Obligatoire depuis le 1<sup>er</sup> septembre 2026 pour recevoir vos factures</div>
    <h1><span class="mk">Facture</span> électronique&#160;:<br>soyez <span class="mk">en règle</span>,<br>simplement.</h1>
    <div class="sub">Vos factures au format légal, celles que vous recevez lues pour vous, et les dates qui vous concernent.</div>
    <div class="foot">odocpilot.com</div>
  </div>
</body>
</html>
